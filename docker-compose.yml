services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wekall
      POSTGRES_PASSWORD: wekall
      POSTGRES_DB: wekall
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wekall -d wekall']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wekall
      DB_PASSWORD: wekall
      DB_NAME: wekall
      WRAP_UP_SECONDS: 15
      MAX_WAIT_TIME_SEC: 60
      SLA_THRESHOLD_SEC: 20
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  pgdata:
